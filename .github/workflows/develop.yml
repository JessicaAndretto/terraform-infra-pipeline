name: "DEV DEPLOY"

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: dev
      aws-assume-role-arn: "arn:aws:iam::740417536221:role/github-actions-pipeline"
      aws-region: "us-east-1"
      aws-statefile-s3-bucket: "cicd-test-dev-pipeline"
      aws-lock-dynamodb-table: "jessicaandretto-us-east-1-terraform-lock"